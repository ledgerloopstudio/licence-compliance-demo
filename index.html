<script id="logic">
/* ============================================================================
   PURE LOGIC — no DOM. Plain data in, plain data out, unit-testable.

   THE HARD PROBLEM THIS SOLVES: a licence belongs to a PERSON, and a business
   is only compliant if every person on the roster is current. One tradesperson
   tracking their own renewal is the easy case. A contractor with six licensed
   staff across three states, each with their own CE cycle, plus company-level
   insurance and bond expiries, is the case that actually costs money when it
   goes wrong.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   CONFIGURATION — EDIT FREELY. Licence classes, CE requirements, cycle lengths
   and renewal windows are set by each state or licensing authority, differ by
   trade and class, and change. Nothing below states any authority's current
   rules. Confirm every figure against your own licensing board.
   Last reviewed by the author: 2026-09-17.
   --------------------------------------------------------------------------- */
var CRITERIA_REVIEWED = "2026-09-17";

var TRADES = [
  { id: "electrical",  label: "Electrical" },
  { id: "hvac",        label: "HVAC / refrigeration" },
  { id: "plumbing",    label: "Plumbing" },
  { id: "general",     label: "General contracting" },
  { id: "roofing",     label: "Roofing" },
  { id: "realestate",  label: "Real estate" },
  { id: "insurance",   label: "Insurance producer" },
  { id: "accounting",  label: "Accounting / CPA" },
  { id: "lowvoltage",  label: "Low voltage / alarm" },
  { id: "elevator",    label: "Elevator" },
  { id: "wellpump",    label: "Well & pump" },
  { id: "other",       label: "Other trade or profession" }
];

var CE_TOPICS = [
  { id: "code",        label: "Code update" },
  { id: "safety",      label: "Safety / OSHA" },
  { id: "business",    label: "Business & law" },
  { id: "ethics",      label: "Ethics" },
  { id: "technical",   label: "Technical / trade skills" },
  { id: "energy",      label: "Energy efficiency" },
  { id: "supervision", label: "Supervision & management" },
  { id: "other",       label: "Other approved" }
];

/* Company-level documents that also expire and also stop you working. */
var DOC_TYPES = [
  { id: "liability",   label: "General liability insurance" },
  { id: "workcomp",    label: "Workers' compensation" },
  { id: "bond",        label: "Surety bond" },
  { id: "vehicle",     label: "Commercial vehicle insurance" },
  { id: "registration",label: "Business registration" },
  { id: "certification", label: "Trade certification" },
  { id: "other",       label: "Other document" }
];

/* ---------- helpers ---------- */
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function toISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseISO(s) {
  if (!s) return null;
  var p = String(s).split("-");
  if (p.length !== 3) return null;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
function daysUntil(a, b) {
  var x = parseISO(a), y = parseISO(b);
  if (!x || !y) return null;
  return Math.round((y - x) / 86400000);
}
function addMonths(iso, months) {
  var d = parseISO(iso);
  if (!d) return null;
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setMonth(t.getMonth() + months);
  return toISO(t);
}
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round1(n) { return Math.round(n * 10) / 10; }
function pct(part, whole) { return whole > 0 ? (part / whole) * 100 : 0; }
function tradeLabel(id) {
  for (var i = 0; i < TRADES.length; i++) { if (TRADES[i].id === id) return TRADES[i].label; }
  return id || "";
}
function topicLabel(id) {
  for (var i = 0; i < CE_TOPICS.length; i++) { if (CE_TOPICS[i].id === id) return CE_TOPICS[i].label; }
  return id || "";
}
function docTypeLabel(id) {
  for (var i = 0; i < DOC_TYPES.length; i++) { if (DOC_TYPES[i].id === id) return DOC_TYPES[i].label; }
  return id || "";
}

/* ---------- CE allocation ---------- */
function appliesTo(ceRow, licenceId) {
  var list = ceRow.licences || [];
  for (var i = 0; i < list.length; i++) { if (list[i] === licenceId) return true; }
  return false;
}
function ceForLicence(ceRows, licence) {
  var start = licence.cycleStart;
  var end = addMonths(start, num(licence.cycleMonths));
  var out = [];
  for (var i = 0; i < ceRows.length; i++) {
    var r = ceRows[i];
    if (!appliesTo(r, licence.id)) continue;
    if (!r.date) continue;
    if (r.date >= start && r.date <= end) out.push(r);
  }
  return out;
}
function hoursByTopic(ceRows) {
  var map = {};
  for (var i = 0; i < ceRows.length; i++) {
    var k = ceRows[i].topic || "other";
    map[k] = round1((map[k] || 0) + num(ceRows[i].hours));
  }
  return map;
}

/* THE PER-LICENCE STATUS. */
function licenceStatus(licence, ceRows, todayISOstr, warnDays) {
  var warn = warnDays === undefined ? 90 : warnDays;
  var rows = ceForLicence(ceRows, licence);
  var cycleEnd = addMonths(licence.cycleStart, num(licence.cycleMonths));

  var logged = 0, unverified = 0;
  for (var i = 0; i < rows.length; i++) {
    logged += num(rows[i].hours);
    if (rows[i].certificate !== "1") unverified += num(rows[i].hours);
  }
  logged = round1(logged); unverified = round1(unverified);

  var byTopic = hoursByTopic(rows);
  var mins = licence.topicMins || [];
  var topicChecks = [];
  var topicsMet = true;
  for (var m = 0; m < mins.length; m++) {
    var have = byTopic[mins[m].topic] || 0;
    var need = num(mins[m].hours);
    var ok = have >= need;
    if (!ok) topicsMet = false;
    topicChecks.push({ topic: mins[m].topic, label: topicLabel(mins[m].topic),
                       have: round1(have), need: need, ok: ok,
                       percent: need > 0 ? Math.min(100, pct(have, need)) : 100 });
  }

  var need = num(licence.ceHours);
  var remaining = Math.max(0, need - logged);
  var expiry = licence.expiry || cycleEnd;
  var daysLeft = daysUntil(todayISOstr, expiry);
  var monthsLeft = daysLeft === null ? null : daysLeft / 30.44;

  return {
    licenceId: licence.id, personId: licence.personId,
    cycleStart: licence.cycleStart, cycleEnd: cycleEnd, expiry: expiry,
    entries: rows.length,
    logged: logged, unverified: unverified,
    need: need, remaining: round1(remaining),
    byTopic: byTopic, topicChecks: topicChecks, topicsMet: topicsMet,
    hoursMet: logged >= need,
    certificatesComplete: unverified === 0,
    daysLeft: daysLeft,
    expired: daysLeft !== null && daysLeft < 0,
    expiringSoon: daysLeft !== null && daysLeft >= 0 && daysLeft <= warn,
    perMonthNeeded: monthsLeft && monthsLeft > 0 ? round1(remaining / monthsLeft) : null,
    percent: need > 0 ? Math.min(100, pct(logged, need)) : 100,
    ready: logged >= need && topicsMet && unverified === 0
  };
}

/* THE ROSTER VIEW — is this person clear to work? */
function personStatus(person, licences, ceRows, todayISOstr, warnDays) {
  var mine = [];
  for (var i = 0; i < licences.length; i++) {
    if (licences[i].personId === person.id) mine.push(licences[i]);
  }
  var statuses = [], expired = 0, soon = 0, short = 0, ready = 0;
  for (var j = 0; j < mine.length; j++) {
    var s = licenceStatus(mine[j], ceRows, todayISOstr, warnDays);
    statuses.push(s);
    if (s.expired) expired++;
    else if (s.expiringSoon) soon++;
    if (!s.ready) short++; else ready++;
  }
  var state = expired > 0 ? "expired"
    : (mine.length === 0 ? "none"
      : (soon > 0 && short > 0 ? "atrisk"
        : (short > 0 ? "short" : "clear")));
  return {
    personId: person.id, licences: mine.length, statuses: statuses,
    expired: expired, expiringSoon: soon, notReady: short, ready: ready,
    state: state,
    clearToWork: expired === 0 && mine.length > 0
  };
}

/* Company-level documents. */
function docStatus(doc, todayISOstr, warnDays) {
  var warn = warnDays === undefined ? 60 : warnDays;
  var d = daysUntil(todayISOstr, doc.expiry);
  return {
    daysLeft: d,
    expired: d !== null && d < 0,
    expiringSoon: d !== null && d >= 0 && d <= warn,
    state: d === null ? "unknown" : (d < 0 ? "expired" : (d <= warn ? "soon" : "ok"))
  };
}

/* One calendar for everything that expires: licences and company documents. */
function renewalCalendar(licences, docs, people, todayISOstr) {
  var nameOf = function (pid) {
    for (var i = 0; i < people.length; i++) { if (people[i].id === pid) return people[i].name; }
    return "";
  };
  var items = [];
  for (var i = 0; i < licences.length; i++) {
    var L = licences[i];
    var exp = L.expiry || addMonths(L.cycleStart, num(L.cycleMonths));
    items.push({ kind: "licence", id: L.id,
                 label: tradeLabel(L.trade) + " — " + (L.state || ""),
                 who: nameOf(L.personId), detail: L.number || "",
                 date: exp, daysLeft: daysUntil(todayISOstr, exp) });
  }
  for (var j = 0; j < docs.length; j++) {
    items.push({ kind: "document", id: docs[j].id, label: docTypeLabel(docs[j].type),
                 who: docs[j].holder || "Company", detail: docs[j].number || "",
                 date: docs[j].expiry, daysLeft: daysUntil(todayISOstr, docs[j].expiry) });
  }
  items.sort(function (a, b) {
    if (a.date === b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date < b.date ? -1 : 1;
  });
  return items;
}

/* COMPANY COMPLIANCE — the one number an owner actually wants. */
function companyCompliance(people, licences, docs, ceRows, todayISOstr) {
  var peopleClear = 0, peopleAtRisk = 0, peopleBlocked = 0;
  for (var i = 0; i < people.length; i++) {
    var ps = personStatus(people[i], licences, ceRows, todayISOstr);
    if (ps.state === "expired") peopleBlocked++;
    else if (ps.state === "clear") peopleClear++;
    else peopleAtRisk++;
  }
  var docsExpired = 0, docsSoon = 0;
  for (var j = 0; j < docs.length; j++) {
    var ds = docStatus(docs[j], todayISOstr);
    if (ds.expired) docsExpired++;
    else if (ds.expiringSoon) docsSoon++;
  }
  var licExpired = 0, licSoon = 0, licShort = 0;
  for (var k = 0; k < licences.length; k++) {
    var ls = licenceStatus(licences[k], ceRows, todayISOstr);
    if (ls.expired) licExpired++;
    else if (ls.expiringSoon) licSoon++;
    if (!ls.ready) licShort++;
  }

  var problems = peopleBlocked + docsExpired;
  var warnings = peopleAtRisk + docsSoon;
  var lamp = problems > 0 ? "r" : (warnings > 0 ? (warnings > 2 ? "o" : "y") : "g");

  /* Name the actual cause. A lapsed bond and a lapsed licence are both
     red, but they stop different things, so say which one it is. */
  var verdict;
  if (peopleBlocked > 0 && docsExpired > 0) verdict = "Licence and document expired";
  else if (peopleBlocked > 0) verdict = "Someone cannot work today";
  else if (docsExpired > 0) verdict = "A company document has expired";
  else if (warnings > 0) verdict = "Action needed this month";
  else verdict = "Everything current";

  return {
    people: people.length, peopleClear: peopleClear,
    peopleAtRisk: peopleAtRisk, peopleBlocked: peopleBlocked,
    licences: licences.length, licExpired: licExpired, licSoon: licSoon, licShort: licShort,
    docs: docs.length, docsExpired: docsExpired, docsSoon: docsSoon,
    lamp: lamp, verdict: verdict,
    score: people.length ? Math.round(pct(peopleClear, people.length)) : 0
  };
}

function toCSV(rows) {
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var line = [];
    for (var j = 0; j < rows[i].length; j++) {
      var cell = rows[i][j] === null || rows[i][j] === undefined ? "" : String(rows[i][j]);
      line.push('"' + cell.replace(/"/g, '""') + '"');
    }
    out.push(line.join(","));
  }
  return out.join("\n");
}
</script>

function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function blank() {

  };

function seed() {

  var iso = function (mb, day) { return toISO(new Date(today.getFullYear(), today.getMonth() - mb, day)); };
  var fwd = function (mf, day) { return toISO(new Date(today.getFullYear(), today.getMonth() + mf, day)); };

  var p1 = uid(), p2 = uid(), p3 = uid();
  var people = [
    { id: p1, name: "You (owner)", role: "Master electrician / owner", email: "", phone: "", notes: "" },
    { id: p2, name: "D. Marchetti", role: "Journeyman electrician", email: "", phone: "", notes: "" },
    { id: p3, name: "S. Okonkwo", role: "HVAC technician", email: "", phone: "", notes: "Cross-trained, holds two licences" }
  ];

  var l1 = uid(), l2 = uid(), l3 = uid(), l4 = uid();

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { STATE = JSON.parse(raw); }
  } catch (e) { STATE = null; }
  if (!STATE || !STATE.licences) STATE = seed();
  if (!STATE.settings) STATE.settings = { dark: "0" };
  if (!STATE.people) STATE.people = [];
  if (!STATE.ce) STATE.ce = [];
  if (!STATE.docs) STATE.docs = [];
  if (!STATE.company) STATE.company = blank().company;
  document.documentElement.setAttribute("data-dark", STATE.settings.dark === "1" ? "1" : "0");
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(STATE)); } catch (e) { } }

function el(tag, attrs, html) {
  var a = "";
  if (attrs) {
    for (var k in attrs) {
      if (attrs[k] === null || attrs[k] === undefined || attrs[k] === "") continue;
      a += " " + k + '="' + String(attrs[k]).replace(/"/g, "&quot;") + '"';
    }
  }
  return "<" + tag + a + ">" + (html === undefined || html === null ? "" : html) + "</" + tag + ">";
}

function warnDays() { return num(STATE.company.warnDays) || 90; }
function docWarnDays() { return num(STATE.company.docWarnDays) || 60; }

function personById(id) {
  for (var i = 0; i < STATE.people.length; i++) { if (STATE.people[i].id === id) return STATE.people[i]; }
  return null;
}
function personName(id) { var p = personById(id); return p ? p.name : "— unassigned —"; }
function licenceById(id) {
  for (var i = 0; i < STATE.licences.length; i++) { if (STATE.licences[i].id === id) return STATE.licences[i]; }
  return null;
}
function licenceLabel(id) {
  var L = licenceById(id);
  return L ? tradeLabel(L.trade) + " · " + (L.state || "") + " · " + personName(L.personId) : "—";
}
function personOptions(sel) {

function statusPill(s) {
  if (s.expired) return el("span", { "class": "pill bad" }, "Expired");
  if (s.ready && !s.expiringSoon) return el("span", { "class": "pill good" }, "Ready");
  if (s.ready && s.expiringSoon) return el("span", { "class": "pill blue" }, "Ready, renewing soon");
  if (s.expiringSoon) return el("span", { "class": "pill bad" }, "Due soon, short");
  return el("span", { "class": "pill amber" }, "In progress");
}
function personPill(ps) {
  if (ps.state === "expired") return el("span", { "class": "pill bad" }, "Cannot work");
  if (ps.state === "none") return el("span", { "class": "pill" }, "No licence");
  if (ps.state === "atrisk") return el("span", { "class": "pill bad" }, "At risk");
  if (ps.state === "short") return el("span", { "class": "pill amber" }, "CE outstanding");
  return el("span", { "class": "pill good" }, "Clear");
}

function listCard(title, rows, rowFn, emptyMsg, headHtml) {
  var body;
  if (!rows.length) {
    body = el("div", { "class": "empty" }, el("b", {}, "Nothing here yet") + esc(emptyMsg));
  } else {
    var trs = "";
    for (var i = 0; i < rows.length; i++) trs += rowFn(rows[i], i);
    body = el("div", { "class": "tblwrap" }, el("table", {}, (headHtml || "") + trs));
  }
  return el("div", { "class": "card" }, el("h3", {}, esc(title)) + body);
}

  else if (VIEW === "people") html = viewPeople();
  else if (VIEW === "licences") html = viewLicences();
  else if (VIEW === "ce") html = viewCE();
  else if (VIEW === "requirements") html = viewRequirements();
  else if (VIEW === "docs") html = viewDocs();
  else if (VIEW === "calendar") html = viewCalendar();
  else if (VIEW === "reports") html = viewReports();

  document.getElementById("app").innerHTML = html;

function val(id) { var n = document.getElementById(id); return n ? n.value : ""; }

function download(name, text, type) {
  var blob = new Blob([text], { type: type || "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.addEventListener("click", function (ev) {
  var t = ev.target;
  var g = function (attr) {
    var n = t;
    while (n && n !== document) {
      if (n.getAttribute && n.getAttribute(attr) !== null) return n.getAttribute(attr);
      n = n.parentNode;
    }
    return null;
  };

  if (g("data-tab")) { VIEW = g("data-tab"); MODAL = null; EDIT = null; render(); return; }
  if (g("data-dark")) {
    STATE.settings.dark = STATE.settings.dark === "1" ? "0" : "1";
    document.documentElement.setAttribute("data-dark", STATE.settings.dark);
    save(); render(); return;
  }
  if (g("data-close") || (g("data-modal") && t.className === "modal")) { MODAL = null; EDIT = null; render(); return; }
  if (g("data-print")) { window.print(); return; }

  /* people */
  if (g("data-new-p")) { MODAL = "person"; EDIT = null; render(); return; }
  if (g("data-edit-p")) { MODAL = "person"; EDIT = g("data-edit-p"); render(); return; }
  if (g("data-del-p")) {
    var idp = g("data-del-p");
    if (confirm("Delete this person? Their licences stay but become unassigned.")) {
      STATE.people = STATE.people.filter(function (x) { return x.id !== idp; });
      for (var i = 0; i < STATE.licences.length; i++) {
        if (STATE.licences[i].personId === idp) STATE.licences[i].personId = "";
      }
      save(); render();
    }
    return;
  }
  if (g("data-save-p")) {
    var pn = val("pName").trim();
    if (!pn) { alert("Give this person a name."); return; }
    var prec = { id: EDIT || uid(), name: pn, role: val("pRole"), email: val("pEmail"),
                 phone: val("pPhone"), notes: val("pNotes") };
    if (EDIT) { STATE.people = STATE.people.map(function (x) { return x.id === EDIT ? prec : x; }); }
    else { STATE.people.push(prec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }
  if (g("data-save-company")) {
    STATE.company = { name: val("coName"), warnDays: num(val("coWarn")) || 90,
                      docWarnDays: num(val("coDocWarn")) || 60 };
    save(); render(); return;
  }

  /* licences */
  if (g("data-new-l")) { MODAL = "licence"; EDIT = null; render(); return; }
  if (g("data-edit-l")) { MODAL = "licence"; EDIT = g("data-edit-l"); render(); return; }
  if (g("data-del-l")) {
    var idl = g("data-del-l");
    if (confirm("Delete this licence? CE entries stay but lose this assignment.")) {
      STATE.licences = STATE.licences.filter(function (x) { return x.id !== idl; });
      for (var j = 0; j < STATE.ce.length; j++) {
        STATE.ce[j].licences = (STATE.ce[j].licences || []).filter(function (x) { return x !== idl; });
      }
      save(); render();
    }
    return;
  }
  if (g("data-save-l")) {
    var st = val("lState").trim();
    if (!st) { alert("Which state issued this licence?"); return; }
    var existing = EDIT ? licenceById(EDIT) : null;
    var lrec = { id: EDIT || uid(), personId: val("lPerson"), trade: val("lTrade"), state: st,
                 classLevel: val("lClass"), number: val("lNumber"),
                 cycleStart: val("lCycleStart") || todayISO(),
                 cycleMonths: num(val("lCycleMonths")) || 24, ceHours: num(val("lCeHours")),
                 expiry: val("lExpiry"),
                 topicMins: existing ? (existing.topicMins || []) : [], notes: val("lNotes") };
    if (EDIT) { STATE.licences = STATE.licences.map(function (x) { return x.id === EDIT ? lrec : x; }); }
    else { STATE.licences.push(lrec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  /* topic minimums */
  if (g("data-add-tm")) {
    var lid = g("data-add-tm");
    var L2 = licenceById(lid);
    if (!L2) return;
    var hours = num(val("tmh_" + lid));
    if (hours <= 0) { alert("How many hours are required in that topic?"); return; }
    if (!L2.topicMins) L2.topicMins = [];
    L2.topicMins.push({ topic: val("tm_" + lid), hours: hours });
    save(); render(); return;
  }
  if (g("data-del-tm")) {
    var parts = g("data-del-tm").split("|");
    var L3 = licenceById(parts[0]);
    if (L3 && L3.topicMins) { L3.topicMins.splice(Number(parts[1]), 1); save(); render(); }
    return;
  }

  /* CE */
  if (g("data-new-e")) { MODAL = "ce"; EDIT = null; render(); return; }
  if (g("data-edit-e")) { MODAL = "ce"; EDIT = g("data-edit-e"); render(); return; }
  if (g("data-del-e")) {
    var ide = g("data-del-e");
    if (confirm("Delete this course?")) {
      STATE.ce = STATE.ce.filter(function (x) { return x.id !== ide; });
      save(); render();
    }
    return;
  }
  if (g("data-save-e")) {
    var eh = num(val("eHours"));
    if (eh <= 0) { alert("Enter the course hours."); return; }
    var boxes = document.querySelectorAll("[data-lic-check]");
    var lics = [];
    for (var b = 0; b < boxes.length; b++) {
      if (boxes[b].checked) lics.push(boxes[b].getAttribute("data-lic-check"));
    }
    if (!lics.length && STATE.licences.length) {
      if (!confirm("This course is not assigned to any licence, so it will not count. Save anyway?")) return;
    }
    var erec = { id: EDIT || uid(), date: val("eDate") || todayISO(), title: val("eTitle"),
                 topic: val("eTopic"), hours: eh, provider: val("eProv"),
                 certificate: val("eCert"), licences: lics, notes: val("eNotes") };
    if (EDIT) { STATE.ce = STATE.ce.map(function (x) { return x.id === EDIT ? erec : x; }); }
    else { if(demoLimitReached()) return; STATE.ce.push(erec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  /* documents */
  if (g("data-new-d")) { MODAL = "doc"; EDIT = null; render(); return; }
  if (g("data-edit-d")) { MODAL = "doc"; EDIT = g("data-edit-d"); render(); return; }
  if (g("data-del-d")) {
    var idd = g("data-del-d");
    if (confirm("Delete this document?")) {
      STATE.docs = STATE.docs.filter(function (x) { return x.id !== idd; });
      save(); render();
    }
    return;
  }
  if (g("data-save-d")) {
    var drec = { id: EDIT || uid(), type: val("dType"), holder: val("dHolder"),
                 provider: val("dProvider"), number: val("dNumber"),
                 issued: val("dIssued"), expiry: val("dExpiry"), notes: val("dNotes") };
    if (EDIT) { STATE.docs = STATE.docs.map(function (x) { return x.id === EDIT ? drec : x; }); }
    else { STATE.docs.push(drec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  /* export */
  if (g("data-export-json")) {
    download("licence-compliance-backup-" + todayISO() + ".json", JSON.stringify(STATE, null, 2));
    return;
  }
  if (g("data-export-csv")) {
    var rows = [["Date", "Course", "Topic", "Hours", "Provider", "Certificate", "Counts toward", "Notes"]];
    var cs = STATE.ce.slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    for (var i2 = 0; i2 < cs.length; i2++) {
      var names = [];
      var ll = cs[i2].licences || [];
      for (var j2 = 0; j2 < ll.length; j2++) names.push(licenceLabel(ll[j2]));
      rows.push([cs[i2].date, cs[i2].title || "", topicLabel(cs[i2].topic), cs[i2].hours,
        cs[i2].provider || "", cs[i2].certificate === "1" ? "Yes" : "No",
        names.join(" / "), cs[i2].notes || ""]);
    }
    download("ce-log-" + todayISO() + ".csv", toCSV(rows), "text/csv");
    return;
  }
  if (g("data-export-lic")) {
    var lrows = [["Holder", "Trade", "State", "Class", "Number", "Cycle start",
                  "Cycle months", "CE required", "CE logged", "Unproven", "Expiry", "Status"]];
    for (var k2 = 0; k2 < STATE.licences.length; k2++) {
      var LL = STATE.licences[k2];
      var ss = licenceStatus(LL, STATE.ce, todayISO(), warnDays());
      lrows.push([personName(LL.personId), tradeLabel(LL.trade), LL.state || "", LL.classLevel || "",
        LL.number || "", LL.cycleStart, LL.cycleMonths, ss.need, ss.logged, ss.unverified,
        ss.expiry || "", ss.expired ? "Expired" : (ss.ready ? "Ready" : "Outstanding")]);
    }
    download("licences-" + todayISO() + ".csv", toCSV(lrows), "text/csv");
    return;
  }
  if (g("data-reset")) {
    if (confirm("Clear everything and start empty? Export a backup first if you need one.")) {
      STATE = blank(); save(); VIEW = "dash"; render();
    }
    return;
  }
  if (g("data-import")) {
    var f = document.getElementById("importFile");
    if (f) f.click();
    return;
  }
});

document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t && t.getAttribute && t.getAttribute("data-pack-lic") !== null) {
    PACKLIC = t.value; render(); return;
  }
  if (t && t.id === "importFile" && t.files && t.files[0]) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var obj = JSON.parse(e.target.result);
        if (!obj || !obj.licences) throw new Error("bad file");
        STATE = obj;
        if (!STATE.settings) STATE.settings = { dark: "0" };
        if (!STATE.people) STATE.people = [];
        if (!STATE.ce) STATE.ce = [];
        if (!STATE.docs) STATE.docs = [];
        if (!STATE.company) STATE.company = blank().company;
        save(); render();
      } catch (err) { alert("That file could not be read as a backup."); }
    };
    reader.readAsText(t.files[0]);
  }
});

load();
render();
</script>
</body></html>
